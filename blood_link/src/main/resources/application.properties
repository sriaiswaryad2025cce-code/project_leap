# Application Name
spring.application.name=BloodLink

# ===== MySQL Database Configuration =====
spring.datasource.url=jdbc:mysql://localhost:3306/blood_link_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Root0703
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate Configuration =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ===== Server Configuration =====
server.port=8080

# ===== Logging =====
logging.level.com.example.blood_link=DEBUG
logging.level.org.springframework.web=INFO
